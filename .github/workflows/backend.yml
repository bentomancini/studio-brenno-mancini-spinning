name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - run: npm audit --omit=dev --audit-level=moderate
      # Real Supabase + SMTP homologation is a separate, explicit operator gate.
      # No production credentials, deployments or migrations in this workflow.
  browser:
    name: Chromium UI and actor-boundary regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated Chromium and Linux browser libraries
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: All public, product, QA and independent audit browser tests
        run: npx --no-install playwright test --config tests/browser/all.config.ts
      - name: Failure-only browser evidence (synthetic test data)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: false
          path: |
            test-results/
            playwright-report/
    # Harness-only Auth HTTP and disposable native PostgreSQL. No production
    # credentials/secrets, provider homologation, deploy or remote migrations.
